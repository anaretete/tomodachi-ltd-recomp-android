name: Build Multi-Architecture Android APKs & Publish Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Multi-ABI APKs (Universal, ARM64, ARM32, x86_64, x86)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK & SDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.22.1'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build All Android Release APKs
        run: |
          cd android
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Stage and Sign All APKs
        run: |
          mkdir -p artifacts

          # Generate dedicated release signing keystore
          keytool -genkey -v -keystore release.jks -alias tomodachi -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android -dname "CN=Tomodachi, OU=Recomp, O=Recomp, L=City, S=State, C=US"

          # Find apksigner
          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Using apksigner at: $APKSIGNER"

          # Locate all built release APKs
          find android/app/build/outputs/apk/release -name "*.apk" -print

          for f in $(find android/app/build/outputs/apk/release -name "*.apk"); do
            filename=$(basename "$f")
            echo "Processing $filename..."

            dest_name="tomodachi-ltd-recomp-${filename}"
            if [[ "$filename" == *"universal"* ]]; then
              dest_name="tomodachi-ltd-recomp-universal.apk"
            elif [[ "$filename" == *"arm64-v8a"* ]]; then
              dest_name="tomodachi-ltd-recomp-arm64-v8a.apk"
            elif [[ "$filename" == *"armeabi-v7a"* ]]; then
              dest_name="tomodachi-ltd-recomp-armeabi-v7a.apk"
            elif [[ "$filename" == *"x86_64"* ]]; then
              dest_name="tomodachi-ltd-recomp-x86_64.apk"
            elif [[ "$filename" == *"x86"* ]]; then
              dest_name="tomodachi-ltd-recomp-x86.apk"
            else
              dest_name="tomodachi-ltd-recomp-release.apk"
            fi

            cp "$f" "artifacts/$dest_name"
            
            # Sign with apksigner (V1, V2, V3, V4 schemes)
            $APKSIGNER sign --ks release.jks --ks-pass pass:android --key-pass pass:android "artifacts/$dest_name"
            $APKSIGNER verify "artifacts/$dest_name"
            echo "Successfully signed and verified artifacts/$dest_name"
          done

          ls -lh artifacts/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tomodachi-ltd-recomp-all-apks
          path: artifacts/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.3
          name: "Tomodachi Life Recomp Android v1.0.3"
          body: |
            ### Native Android Port for Tomodachi Life Recomp (Multi-Architecture v1.0.3)
            
            **Available APK Downloads:**
            - [**`tomodachi-ltd-recomp-universal.apk`**](https://github.com/anaretete/tomodachi-ltd-recomp-android/releases/download/v1.0.3/tomodachi-ltd-recomp-universal.apk): All-in-one APK supporting ARM64, ARM32, x86_64, and x86 devices and emulators. (Recommended)
            - [**`tomodachi-ltd-recomp-arm64-v8a.apk`**](https://github.com/anaretete/tomodachi-ltd-recomp-android/releases/download/v1.0.3/tomodachi-ltd-recomp-arm64-v8a.apk): Optimized for modern 64-bit ARM smartphones and Google Pixel / Tensor devices.
            - [**`tomodachi-ltd-recomp-x86_64.apk`**](https://github.com/anaretete/tomodachi-ltd-recomp-android/releases/download/v1.0.3/tomodachi-ltd-recomp-x86_64.apk): Optimized for PC Android emulators (BlueStacks, LDPlayer, Android Studio, WSA) and Chromebooks.
            - [**`tomodachi-ltd-recomp-armeabi-v7a.apk`**](https://github.com/anaretete/tomodachi-ltd-recomp-android/releases/download/v1.0.3/tomodachi-ltd-recomp-armeabi-v7a.apk): For 32-bit ARM Android devices.
            - [**`tomodachi-ltd-recomp-x86.apk`**](https://github.com/anaretete/tomodachi-ltd-recomp-android/releases/download/v1.0.3/tomodachi-ltd-recomp-x86.apk): For 32-bit x86 emulators.
            
            **✨ What's New in v1.0.3:**
            - **Google Tensor (Pixel 6/7/8/9) CPU Architecture Optimization**:
              - Strict **16KB memory page size alignment** (`-Wl,-z,max-page-size=16384`) conforming to Android 15 & Tensor G3/G4 kernel specifications, eliminating ELF loading crashes.
              - ARMv8.2-A+ with runtime LSE outline atomics (`-moutline-atomics`) for peak multi-core dispatch performance on Google Tensor clusters.
            - **Imagination Technologies (PowerVR / IMG B-Series / Rogue) GPU Compatibility**:
              - Dynamic `supportedCompositeAlpha` negotiation (transparently handles devices where `INHERIT` is unsupported, falling back to `OPAQUE` / `PRE_MULTIPLIED`).
              - Swapchain usage flags verification (`VK_IMAGE_USAGE_TRANSFER_DST_BIT` guarded against hardware swapchain limits).
              - Dynamic graphics queue family index detection (resolves crashes on PowerVR drivers where queue index 0 is not the graphics family).
              - Dual subpass dependencies configured for Tile-Based Deferred Rendering (TBDR) architectures (PowerVR and ARM Mali).
              - Seamless OpenGL ES 3.0 / EGL fallback bridge for legacy PowerVR chips with incomplete Vulkan surface support.
            - **Enhanced Hardware Diagnostics**: System badge identifies Tensor SoC model and PowerVR GPU acceleration state at startup.
            - **Full Cryptographic Signatures**: All APKs signed with v1/v2/v3 signatures via `apksigner`.
          draft: false
          prerelease: false
          files: artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
